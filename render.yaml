# Render blueprint — deploys PriceTruth as a long-running Node web service.
# In Render: New + → Blueprint → connect the PriceTruth repo → Apply.
#
# The public demo is usable with NO secrets set: unsupported verified searches
# fail closed and hand off to manual price input. Accounts, notifications, and billing are explicitly
# disabled on this ephemeral blueprint. Optional provider secrets below are
# marked `sync: false`, so Render prompts for them in the dashboard and they
# are NEVER stored in this repo. This demo blueprint must not receive Stripe
# credentials; use `render.production.yaml` for paid deployment.
#
# ⚠ DATA DURABILITY. On the `free` plan the container filesystem is EPHEMERAL:
# it is wiped on every deploy, restart, and idle spin-down/cold-start. The app
# re-seeds demo products on boot, so it always looks healthy — but any runtime
# data (paid entitlements, minted API keys, the revenue ledger, alerts, accrued
# price history) is LOST on restart. That is fine for a demo, but you must NOT
# enable live Stripe billing on an ephemeral free instance — paying customers'
# access and keys would silently vanish. To retain data: move to a plan that
# supports a persistent disk, uncomment the `disk:` block below, and set
# PRICETRUTH_DB to a path on that disk (the code already honors PRICETRUTH_DB).
services:
  - type: web
    name: pricetruth
    runtime: node
    plan: free
    # Persistent storage — REQUIRED before enabling live billing. Uncomment and
    # switch off the free plan; then set PRICETRUTH_DB (below) to /var/data/...
    # disk:
    #   name: pricetruth-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # `npm run build` boots the whole app on loopback, checks health, and prints
    # a verified-vs-manual-only report — a real preflight before the service starts.
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      # --- required for correct hosting -------------------------------------
      # Render routes to the container's public interface; the app defaults to
      # loopback-only for local safety, so open it up explicitly here.
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ENABLE_ACCOUNTS
        value: "0"
      - key: ENABLE_LIVE_BILLING
        value: "0"
      - key: REQUIRE_EMAIL
        value: "0"
      - key: ENABLE_DEMO_SEED
        value: "1"
      - key: LAUNCH_VERTICALS
        value: hotel,flight,ticket,subscription,retail
      - key: SUBSCRIPTION_CATALOG_MAX_AGE_DAYS
        value: "93"
      # PORT is injected by Render automatically; the server reads process.env.PORT.
      # Canonical origin for checkout success/cancel URLs, OG tags, and sitemap.
      # Set to the service's approved origin-only HTTPS URL.
      - key: PUBLIC_BASE_URL
        sync: false
      # SQLite location. Defaults to a file inside the (ephemeral on free plan)
      # code tree. Point this at a mounted persistent disk (e.g.
      # /var/data/pricetruth.db) once you enable the `disk:` block above.
      - key: PRICETRUTH_DB
        sync: false

      # --- owner-only admin dashboard (/admin, /api/admin/metrics) ----------
      # Unset = the admin route is disabled. Set a long random token to enable.
      - key: ADMIN_TOKEN
        sync: false

      # --- verified data sources (unset = fail closed to manual input) ------
      # Ticketmaster Discovery API (free key): https://developer-acct.ticketmaster.com
      - key: TICKETMASTER_API_KEY
        sync: false
      # Amadeus Self-Service: https://developers.amadeus.com
      # Powers both flights and hotels. The public provider intentionally
      # rejects Amadeus sandbox/test inventory. Enter production credentials
      # only; the non-secret origin is pinned to the exact production host.
      - key: AMADEUS_CLIENT_ID
        sync: false
      - key: AMADEUS_CLIENT_SECRET
        sync: false
      - key: AMADEUS_HOST
        value: https://api.amadeus.com
      # Optional generic retail feed: GET RETAIL_API_URL?q=... -> {price_cents,...}
      - key: RETAIL_API_URL
        sync: false
      - key: RETAIL_API_KEY
        sync: false
