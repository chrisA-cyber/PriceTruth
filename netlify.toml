[build]
  command = "npm run build:netlify"
  publish = "dist/netlify"

[build.environment]
  NODE_VERSION = "24"

# PriceTruth is a native Netlify application: the browser bundle is served from
# the CDN and request-scoped Node functions own every dynamic route. Runtime
# secrets belong in the Netlify UI/CLI/API, not this repository-backed file.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["extension/**", "openapi/openapi.json", "public/index.html"]

[dev]
  publish = "dist/netlify"
  functions = "netlify/functions"
  port = 4780

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/legal.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
